name: Deploy Gorweld to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering

# Repository: https://github.com/DOGECOIN87/Gorweld.git
# Custom Domain: gorweld.fun

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: Gorweld/package-lock.json
        
    - name: Install dependencies
      run: |
        cd Gorweld
        npm ci
        
    - name: Switch to production config
      run: |
        cd Gorweld
        if [ -f "config.production.js" ]; then
          cp config.production.js config.js
          echo "✅ Production config applied"
        else
          echo "⚠️ Using existing config.js"
        fi
        
    - name: Build
      run: |
        cd Gorweld
        npm run build:production
        
    - name: Copy CNAME and static files
      run: |
        cd Gorweld
        cp CNAME dist/
        if [ -f "Gorweld-Logo.png" ]; then cp Gorweld-Logo.png dist/; fi
        if [ -f "metadata.json" ]; then cp metadata.json dist/; fi
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./Gorweld/dist
        cname: gorweld.fun