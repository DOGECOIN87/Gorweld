<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Integration Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .test-section {
            background-color: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 2px solid #3a3a3a;
        }
        .test-section h2 {
            color: #6eff8b;
            margin-top: 0;
        }
        button {
            background-color: #6eff8b;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background-color: #5eff7b;
        }
        .result {
            background-color: #1a1a1a;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #3a3a3a;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            border-color: #6eff8b;
            color: #6eff8b;
        }
        .error {
            border-color: #ff2e66;
            color: #ff2e66;
        }
    </style>
</head>
<body>
    <h1>🧪 API Integration Test</h1>
    <p>This page tests the frontend-backend API integration for the Gorweld card submission system.</p>

    <div class="test-section">
        <h2>1. Backend Health Check</h2>
        <button onclick="testHealthCheck()">Test Health Check</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Get All Cards</h2>
        <button onclick="testGetCards()">Get Cards</button>
        <div id="cards-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. API Client Initialization</h2>
        <button onclick="testApiClient()">Test API Client</button>
        <div id="client-result" class="result"></div>
    </div>

    <script>
        // API Client (simplified version from main app)
        class ApiClient {
            constructor() {
                this.baseURL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:3000/api'
                    : 'https://your-backend-domain.com/api';
                this.maxRetries = 3;
                this.retryDelay = 1000;
            }
            
            async fetchWithRetry(url, options = {}, retryCount = 0) {
                try {
                    const response = await fetch(url, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw {
                            status: response.status,
                            message: data.error || 'Request failed',
                            code: data.code,
                            details: data.details
                        };
                    }
                    
                    return {
                        success: true,
                        data: data
                    };
                    
                } catch (error) {
                    if (retryCount < this.maxRetries) {
                        const delay = this.retryDelay * Math.pow(2, retryCount);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return this.fetchWithRetry(url, options, retryCount + 1);
                    }
                    
                    return {
                        success: false,
                        error: error.message || 'Network request failed',
                        status: error.status,
                        code: error.code
                    };
                }
            }
            
            async getCards() {
                const url = `${this.baseURL}/cards`;
                return await this.fetchWithRetry(url, { method: 'GET' });
            }
            
            async healthCheck() {
                try {
                    const response = await fetch(`${this.baseURL.replace('/api', '')}/health`);
                    const data = await response.json();
                    return {
                        success: response.ok,
                        data: data
                    };
                } catch (error) {
                    return {
                        success: false,
                        error: 'Backend server is not reachable'
                    };
                }
            }
        }

        const apiClient = new ApiClient();

        function displayResult(elementId, result, isSuccess) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(result, null, 2);
            element.className = 'result ' + (isSuccess ? 'success' : 'error');
        }

        async function testHealthCheck() {
            displayResult('health-result', { status: 'Testing...' }, true);
            
            try {
                const result = await apiClient.healthCheck();
                displayResult('health-result', result, result.success);
            } catch (error) {
                displayResult('health-result', { error: error.message }, false);
            }
        }

        async function testGetCards() {
            displayResult('cards-result', { status: 'Fetching cards...' }, true);
            
            try {
                const result = await apiClient.getCards();
                displayResult('cards-result', result, result.success);
            } catch (error) {
                displayResult('cards-result', { error: error.message }, false);
            }
        }

        function testApiClient() {
            const info = {
                baseURL: apiClient.baseURL,
                maxRetries: apiClient.maxRetries,
                retryDelay: apiClient.retryDelay,
                status: 'API Client initialized successfully'
            };
            displayResult('client-result', info, true);
        }

        // Auto-run health check on load
        window.addEventListener('load', () => {
            testHealthCheck();
        });
    </script>
</body>
</html>
