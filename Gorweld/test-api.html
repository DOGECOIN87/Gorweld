<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorbagana API Test</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #6eff8b;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: #18181b;
            border: 2px solid #27272a;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        h2 { color: #fff; }
        .result { 
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #6eff8b;
        }
        .error { border-left-color: #ff2e66; color: #ff2e66; }
        button {
            background: #6eff8b;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover { background: #5eff7b; }
    </style>
</head>
<body>
    <h1>🔍 Gorbagana API Connection Test</h1>
    
    <div class="test-section">
        <h2>TrashScan API Tests</h2>
        <button onclick="testBlockNumber()">Test Block Number</button>
        <button onclick="testTxCount()">Test TX Count</button>
        <button onclick="testSupply()">Test Supply</button>
        <div id="api-results"></div>
    </div>

    <div class="test-section">
        <h2>Direct RPC Tests</h2>
        <button onclick="testRPC()">Test RPC Connection</button>
        <div id="rpc-results"></div>
    </div>

    <div class="test-section">
        <h2>Page Scraping Test</h2>
        <button onclick="testPageScrape()">Test Page Scrape</button>
        <div id="scrape-results"></div>
    </div>

    <script>
        const API_URL = 'https://trashscan.io/api';
        const RPC_URL = 'https://api.testnet-solana.com';

        function addResult(containerId, message, isError = false) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = isError ? 'result error' : 'result';
            div.textContent = message;
            container.appendChild(div);
        }

        async function testBlockNumber() {
            const container = document.getElementById('api-results');
            container.innerHTML = '<div class="result">Testing...</div>';
            
            try {
                const response = await fetch(`${API_URL}?module=proxy&action=eth_blockNumber`);
                const data = await response.json();
                
                if (data.result) {
                    const blockNum = parseInt(data.result, 16) || parseInt(data.result);
                    addResult('api-results', `✓ Block Number: ${blockNum.toLocaleString()}`);
                } else {
                    addResult('api-results', `✗ No result in response: ${JSON.stringify(data)}`, true);
                }
            } catch (error) {
                addResult('api-results', `✗ Error: ${error.message}`, true);
            }
        }

        async function testTxCount() {
            try {
                const response = await fetch(`${API_URL}?module=stats&action=txcount`);
                const data = await response.json();
                
                if (data.result) {
                    addResult('api-results', `✓ TX Count: ${parseInt(data.result).toLocaleString()}`);
                } else {
                    addResult('api-results', `✗ No result: ${JSON.stringify(data)}`, true);
                }
            } catch (error) {
                addResult('api-results', `✗ Error: ${error.message}`, true);
            }
        }

        async function testSupply() {
            try {
                const response = await fetch(`${API_URL}?module=stats&action=ethsupply`);
                const data = await response.json();
                
                if (data.result) {
                    const supply = (parseInt(data.result) / 1e18).toFixed(2);
                    addResult('api-results', `✓ Supply: ${supply}M GOR`);
                } else {
                    addResult('api-results', `✗ No result: ${JSON.stringify(data)}`, true);
                }
            } catch (error) {
                addResult('api-results', `✗ Error: ${error.message}`, true);
            }
        }

        async function testRPC() {
            const container = document.getElementById('rpc-results');
            container.innerHTML = '<div class="result">Testing RPC...</div>';
            
            try {
                const response = await fetch(RPC_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'eth_blockNumber',
                        params: []
                    })
                });
                
                const data = await response.json();
                
                if (data.result) {
                    const blockNum = parseInt(data.result, 16);
                    addResult('rpc-results', `✓ RPC Block Number: ${blockNum.toLocaleString()}`);
                } else if (data.error) {
                    addResult('rpc-results', `✗ RPC Error: ${data.error.message}`, true);
                } else {
                    addResult('rpc-results', `✗ Unexpected response: ${JSON.stringify(data)}`, true);
                }
            } catch (error) {
                addResult('rpc-results', `✗ Connection Error: ${error.message}`, true);
            }
        }

        async function testPageScrape() {
            const container = document.getElementById('scrape-results');
            container.innerHTML = '<div class="result">Testing page scrape...</div>';
            
            try {
                const response = await fetch('https://trashscan.io');
                const html = await response.text();
                
                // Look for numbers that might be block numbers
                const blockMatch = html.match(/block[s]?[:\s#]+(\d{7,})/i);
                const txMatch = html.match(/transaction[s]?[:\s]+(\d{7,})/i);
                
                if (blockMatch) {
                    addResult('scrape-results', `✓ Found Block: ${parseInt(blockMatch[1]).toLocaleString()}`);
                }
                if (txMatch) {
                    addResult('scrape-results', `✓ Found TX: ${parseInt(txMatch[1]).toLocaleString()}`);
                }
                if (!blockMatch && !txMatch) {
                    addResult('scrape-results', '✗ Could not parse stats from page', true);
                }
            } catch (error) {
                addResult('scrape-results', `✗ Error: ${error.message}`, true);
            }
        }

        // Auto-run tests on load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Running automatic API tests...');
            testBlockNumber();
            setTimeout(testRPC, 1000);
        });
    </script>
</body>
</html>
