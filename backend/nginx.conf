# Nginx Configuration for Gorweld Backend API
# Place this file in /etc/nginx/sites-available/gorweld-backend
# Create symlink: sudo ln -s /etc/nginx/sites-available/gorweld-backend /etc/nginx/sites-enabled/

upstream gorweld_backend {
    # PM2 cluster instances
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.gorweld.com;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gorweld.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.gorweld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gorweld.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/gorweld-backend-access.log;
    error_log /var/log/nginx/gorweld-backend-error.log;
    
    # Client body size limit (for file uploads)
    client_max_body_size 25M;
    
    # Proxy settings
    location / {
        proxy_pass http://gorweld_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Caching
        proxy_cache_bypass $http_upgrade;
    }
    
    # Static file serving for uploads
    location /uploads/ {
        alias /var/www/gorweld-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://gorweld_backend;
        access_log off;
    }
}
